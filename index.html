<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Problem Aggregator & Categorizer</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, textarea:focus {
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .results-section {
            margin-top: 30px;
            border-top: 2px solid #e2e8f0;
            padding-top: 20px;
        }

        .cluster-card {
            background: #f1f5f9;
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
        }

        .cluster-title {
            font-weight: bold;
            color: #334155;
            margin-bottom: 5px;
        }

        .problem-item {
            font-size: 0.9rem;
            color: #64748b;
            margin-left: 15px;
            list-style-type: disc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Problem Categorizer</h2>
        
        <form id="problemForm">
            <!-- Select Stream -->
            <div class="form-group">
                <label for="streamSelect">Select Stream</label>
                <select id="streamSelect" required onchange="updateOrganizations()">
                    <option value="" disabled selected>-- Choose a Stream --</option>
                    <option value="education">Education (Colleges/Universities in Bangalore)</option>
                    <option value="tech">Tech Companies</option>
                    <option value="government">Government Offices</option>
                </select>
            </div>

            <!-- Select Organization -->
            <div class="form-group">
                <label for="orgSelect">Select Organization / Institution</label>
                <select id="orgSelect" required>
                    <option value="" disabled selected>-- First select a stream --</option>
                </select>
            </div>

            <!-- Enter Problem -->
            <div class="form-group">
                <label for="problemInput">Describe Your Problem</label>
                <textarea id="problemInput" placeholder="Type your issue here (e.g., Portal login issues, fee payment failure)..." required></textarea>
            </div>

            <button type="submit">Submit & Categorize with AI</button>
        </form>

        <!-- Grouped AI Output Section -->
        <div class="results-section" id="resultsSection" style="display: none;">
            <h3>Live AI Problem Clusters</h3>
            <div id="clustersContainer">
                <!-- Grouped results will appear here -->
            </div>
        </div>
    </div>

    <script>
        // Database of organizations mapped to streams
        const organizations = {
            education: [
                "REVA University",
                "Horizon College",
                "Global Academy of Technology",
                "PES University",
                "RV College of Engineering"
            ],
            tech: [
                "Infosys",
                "Wipro",
                "Tata Consultancy Services (TCS)",
                "Accenture",
                "Cognizant"
            ],
            government: [
                "BBMP (Bangalore Bruhot Mahanagara Palike)",
                "BESCOM (Electricity Board)",
                "Bangalore Water Supply and Sewerage Board (BWSSB)",
                "Regional Transport Office (RTO)"
            ]
        };

        // Mock database holding submitted problems to simulate AI clustering
        const submittedData = {};

        function updateOrganizations() {
            const streamSelect = document.getElementById('streamSelect').value;
            const orgSelect = document.getElementById('orgSelect');
            
            // Clear current options
            orgSelect.innerHTML = '<option value="" disabled selected>-- Choose an Organization --</option>';

            if (organizations[streamSelect]) {
                organizations[streamSelect].forEach(org => {
                    const option = document.createElement('option');
                    option.value = org;
                    option.textContent = org;
                    orgSelect.appendChild(option);
                });
            }
        }

        document.getElementById('problemForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const org = document.getElementById('orgSelect').value;
            const problem = document.getElementById('problemInput').value.trim();

            if (!submittedData[org]) {
                submittedData[org] = [];
            }

            // Push problem (In production, send 'problem' to your backend LLM API for embedding/clustering)
            submittedData[org].push(problem);

            // Clear textarea
            document.getElementById('problemInput').value = '';

            // Render clustered results
            renderClusters(org);
        });

        function renderClusters(org) {
            const resultsSection = document.getElementById('resultsSection');
            const clustersContainer = document.getElementById('clustersContainer');
            
            resultsSection.style.display = 'block';
            clustersContainer.innerHTML = '';

            // Simple keyword-based semantic grouping simulation for the frontend demo
            const problems = submittedData[org];
            
            // For demonstration, we create a primary cluster for the selected org
            const card = document.createElement('div');
            card.className = 'cluster-card';
            
            card.innerHTML = `
                <div class="cluster-title">Institution: ${org}</div>
                <ul>
                    ${problems.map(p => `<li class="problem-item">${escapeHtml(p)}</li>`).join('')}
                </ul>
            `;
            clustersContainer.appendChild(card);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
