<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacknetix - AI Problem Categorizer</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="navbar">
        <div class="brand-title"><i class="fa-solid fa-brain"></i> Hacknetix</div>
        <div class="nav-right">
            <span class="brand-tagline">AI Problem Aggregator</span>
            <div class="account-btn" onclick="toggleDashboard()" title="Open Account Dashboard">
                <i class="fa-solid fa-user-circle"></i>
                <span>My Dashboard</span>
            </div>
        </div>
    </header>

    <div class="container">
        <h2>AI Problem Categorizer</h2>
        
        <form id="problemForm">
            <!-- Select Stream -->
            <div class="form-group">
                <label for="streamSelect">Select Stream</label>
                <select id="streamSelect" required onchange="updateOrganizations()">
                    <option value="" disabled selected>-- Choose a Stream --</option>
                    <option value="education">Education (Colleges/Universities in Bangalore)</option>
                    <option value="tech">Tech Companies</option>
                    <option value="government">Government Offices</option>
                </select>
            </div>

            <!-- Select Organization -->
            <div class="form-group">
                <label for="orgSelect">Select Organization / Institution</label>
                <select id="orgSelect" required>
                    <option value="" disabled selected>-- First select a stream --</option>
                </select>
            </div>

            <!-- Enter Problem -->
            <div class="form-group">
                <label for="problemInput">Describe Your Problem</label>
                <textarea id="problemInput" placeholder="Type your issue here (e.g., Water leaking in washroom, exam portal error, road pothole)..." required></textarea>
            </div>

            <button type="submit">Submit & Categorize with AI</button>
        </form>

        <!-- Grouped AI Output Section -->
        <div class="results-section" id="resultsSection" style="display: none;">
            <h3>Live Categorized Problem Groups</h3>
            <div id="clustersContainer">
                <!-- Grouped category cards will appear here -->
            </div>
        </div>
    </div>

    <!-- User Dashboard Modal -->
    <div id="dashboardModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleDashboard()">&times;</span>
            <h3><i class="fa-solid fa-gauge"></i> Hacknetix User Dashboard</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-number" id="totalPosted">0</span>
                    <span class="stat-label">Problems Posted</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="totalResolved">0</span>
                    <span class="stat-label">Resolved</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="totalOngoing">0</span>
                    <span class="stat-label">On-Going</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
