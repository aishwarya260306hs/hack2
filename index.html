<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Lens - AI Problem Aggregator</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --success-color: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Styling */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        .logo-icon {
            font-size: 1.4rem;
        }

        .dashboard-btn {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dashboard-btn:hover {
            background-color: #30363d;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            padding: 2.5rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h2 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 1.8rem;
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.4rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--accent-hover);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background-color: var(--accent-color);
            color: #0d1117;
        }

        /* Success View Styling */
        .success-view {
            text-align: center;
            display: none;
            padding: 1rem 0;
        }

        .success-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .success-view h3 {
            font-size: 1.5rem;
            margin-bottom: 0.8rem;
            color: var(--text-primary);
        }

        .success-view p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1.8rem;
        }

        .back-btn {
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-btn:hover {
            background-color: #30363d;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <span class="logo-icon">🔍</span>
            <span>Complaint Lens</span>
        </div>
        <a href="#" class="dashboard-btn">
            <span>👤</span> My Dashboard
        </a>
    </header>

    <!-- Main Content Container -->
    <div class="main-container">
        <div class="card">
            
            <!-- Form View -->
            <div id="form-view">
                <h2>AI Problem Categorizer</h2>
                <form id="complaintForm" onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label for="streamSelect">Select Stream</label>
                        <select id="streamSelect" required onchange="updateOrganizations()">
                            <option value="" disabled selected>-- Choose a Stream --</option>
                            <option value="education">🎓 Education (Colleges/Universities in Bangalore)</option>
                            <option value="tech">💻 Tech Companies</option>
                            <option value="gov">🏛️ Government Offices</option>
                            <option value="healthcare">🏥 Healthcare & Hospitals</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="orgSelect">Select Organization / Institution</label>
                        <select id="orgSelect" required>
                            <option value="" disabled selected>-- First select a stream --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="problemDesc">Describe Your Problem</label>
                        <textarea id="problemDesc" placeholder="Type your issue here (e.g., Water leaking in washroom, exam portal error, road pothole)..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Submit & Categorize with AI</button>
                </form>
            </div>

            <!-- Success Confirmation View -->
            <div id="success-view" class="success-view">
                <div class="success-icon">🚀</div>
                <h3>Issue Logged Successfully!</h3>
                <p>Thank you for submitting your issue. Our AI engine has successfully categorized and routed your ticket. We'll resolve your problem at the earliest!</p>
                <button class="back-btn" onclick="resetForm()">Submit Another Issue</button>
            </div>

        </div>
    </div>
